<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みどりの図鑑 — My Plant Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #1a1a14;
    --paper: #f5f0e8;
    --moss: #4a6741;
    --moss-light: #7a9e6e;
    --bark: #8b6f47;
    --cream: #ede8d8;
    --gold: #c8a84b;
    --mist: #d4ddd0;
    --accent: #e07b54;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── grain overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  /* ── HEADER ── */
  header {
    background: var(--moss);
    color: var(--paper);
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,.25);
  }
  .logo {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.5rem; font-weight: 800;
    letter-spacing: .06em;
  }
  .logo span { color: var(--gold); }
  .logo-sub {
    font-family: 'DM Mono', monospace;
    font-size: .65rem; letter-spacing: .2em;
    opacity: .7; margin-top: 2px;
  }
  .header-stats {
    font-family: 'DM Mono', monospace;
    font-size: .75rem; opacity: .8; text-align: right;
  }

  /* ── LAYOUT ── */
  .app { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 64px); }

  /* ── LEFT PANEL ── */
  .left-panel {
    background: var(--cream);
    border-right: 1px solid var(--mist);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* Upload zone */
  .upload-zone {
    padding: 20px;
    border-bottom: 1px solid var(--mist);
  }
  .drop-area {
    border: 2px dashed var(--moss-light);
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: all .25s;
    position: relative;
    background: rgba(122,158,110,.05);
  }
  .drop-area:hover, .drop-area.drag-over {
    border-color: var(--moss);
    background: rgba(122,158,110,.12);
    transform: scale(1.01);
  }
  .drop-area input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
  }
  .drop-icon { font-size: 2.4rem; margin-bottom: 8px; }
  .drop-text { font-size: .85rem; color: var(--moss); font-weight: 700; }
  .drop-sub  { font-size: .72rem; color: #888; margin-top: 4px; }

  /* Progress */
  .analyzing-bar {
    display: none; margin-top: 14px;
    background: rgba(74,103,65,.1); border-radius: 8px; padding: 12px 14px;
  }
  .analyzing-bar.show { display: block; }
  .analyzing-label {
    font-family: 'DM Mono', monospace;
    font-size: .72rem; color: var(--moss); margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot-pulse { display: inline-flex; gap: 4px; }
  .dot-pulse span {
    width: 5px; height: 5px; background: var(--moss-light); border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: .2s; }
  .dot-pulse span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  .progress-track {
    height: 4px; background: rgba(74,103,65,.15); border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0; background: var(--moss-light);
    border-radius: 2px; transition: width .3s ease;
    animation: progress-anim 3s ease-out forwards;
  }
  @keyframes progress-anim { 0%{width:0} 60%{width:70%} 90%{width:90%} 100%{width:100%} }

  /* Entry list */
  .entries-header {
    padding: 14px 20px 10px;
    font-family: 'DM Mono', monospace;
    font-size: .7rem; letter-spacing: .15em; color: #888;
    text-transform: uppercase; border-bottom: 1px solid var(--mist);
    display: flex; justify-content: space-between; align-items: center;
  }
  .entry-count {
    background: var(--moss); color: white;
    font-size: .62rem; padding: 2px 7px; border-radius: 99px;
  }
  .entries-list { overflow-y: auto; flex: 1; }
  .entry-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--mist);
    cursor: pointer; transition: background .15s;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:none} }
  .entry-card:hover { background: rgba(74,103,65,.07); }
  .entry-card.active { background: rgba(74,103,65,.13); border-left: 3px solid var(--moss); }
  .entry-thumb {
    width: 52px; height: 52px; border-radius: 8px;
    object-fit: cover; flex-shrink: 0;
    border: 2px solid var(--mist);
  }
  .entry-info { flex: 1; min-width: 0; }
  .entry-name {
    font-family: 'Shippori Mincho', serif;
    font-size: .92rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry-sci {
    font-family: 'DM Mono', monospace;
    font-size: .65rem; color: #888; font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry-date {
    font-family: 'DM Mono', monospace;
    font-size: .6rem; color: #aaa; margin-top: 3px;
  }
  .entry-badge {
    font-size: .55rem; padding: 2px 6px;
    border-radius: 4px; font-weight: 700; letter-spacing: .05em;
    flex-shrink: 0;
  }
  .badge-plant { background: #d4edda; color: #276139; }
  .badge-animal { background: #fff3cd; color: #856404; }
  .badge-other  { background: #e2e3e5; color: #495057; }

  /* ── RIGHT PANEL ── */
  .right-panel {
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* Map */
  #map {
    flex: 1; min-height: 0;
    background: var(--mist);
  }
  .leaflet-container { font-family: 'Zen Kaku Gothic New', sans-serif; }

  /* Detail drawer */
  .detail-drawer {
    background: white;
    border-top: 2px solid var(--mist);
    height: 0; overflow: hidden;
    transition: height .35s cubic-bezier(.4,0,.2,1);
  }
  .detail-drawer.open { height: 280px; overflow-y: auto; }
  .detail-inner { padding: 20px 28px; display: grid; grid-template-columns: 160px 1fr; gap: 24px; }
  .detail-photo {
    width: 100%; aspect-ratio: 1;
    border-radius: 12px; object-fit: cover;
    border: 3px solid var(--mist);
  }
  .detail-body {}
  .detail-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.4rem; font-weight: 800; line-height: 1.2;
  }
  .detail-sci {
    font-family: 'DM Mono', monospace;
    font-size: .78rem; color: #888; font-style: italic; margin-bottom: 10px;
  }
  .detail-desc {
    font-size: .82rem; line-height: 1.7; color: #444;
    margin-bottom: 12px;
  }
  .detail-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    font-family: 'DM Mono', monospace; font-size: .68rem;
  }
  .meta-chip {
    background: var(--cream); border: 1px solid var(--mist);
    padding: 3px 10px; border-radius: 20px; color: #666;
  }
  .detail-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    padding: 7px 14px; border: none; border-radius: 8px;
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: .78rem;
    cursor: pointer; transition: all .15s; font-weight: 700;
  }
  .btn-edit { background: var(--moss); color: white; }
  .btn-edit:hover { background: #3a5232; }
  .btn-del { background: #fee; color: #c0392b; }
  .btn-del:hover { background: #fcc; }
  .btn-close { background: var(--cream); color: var(--ink); }
  .btn-close:hover { background: var(--mist); }

  /* ── EDIT MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: white; border-radius: 16px;
    padding: 28px; width: 460px; max-width: 95vw;
    transform: translateY(20px) scale(.97); transition: transform .25s;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal-overlay.open .modal { transform: none; }
  .modal-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.1rem; font-weight: 800; margin-bottom: 18px;
    color: var(--moss);
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: .72rem; font-weight: 700;
    letter-spacing: .08em; color: #888; margin-bottom: 5px;
    text-transform: uppercase;
  }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 12px;
    border: 1.5px solid var(--mist); border-radius: 8px;
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: .85rem;
    transition: border-color .15s; background: var(--paper); color: var(--ink);
  }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--moss);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .btn-save { background: var(--moss); color: white; padding: 9px 20px; }
  .btn-save:hover { background: #3a5232; }
  .btn-cancel { background: var(--cream); color: var(--ink); padding: 9px 20px; }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; padding: 40px; text-align: center;
    color: #aaa;
  }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: .5; }
  .empty-text { font-family: 'Shippori Mincho', serif; font-size: 1rem; color: #bbb; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--moss); color: white;
    padding: 12px 20px; border-radius: 10px;
    font-size: .82rem; font-weight: 700;
    transform: translateY(80px); opacity: 0;
    transition: all .3s; z-index: 300;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  .toast.show { transform: none; opacity: 1; }

  /* Custom popup */
  .leaflet-popup-content-wrapper {
    border-radius: 10px; padding: 0; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.2);
  }
  .leaflet-popup-content { margin: 0; }
  .popup-inner {
    padding: 10px 14px; font-family: 'Zen Kaku Gothic New', sans-serif; min-width: 160px;
  }
  .popup-name { font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: .9rem; }
  .popup-sci  { font-family: 'DM Mono', monospace; font-size: .62rem; color: #888; font-style: italic; }
  .popup-date { font-family: 'DM Mono', monospace; font-size: .6rem; color: #aaa; margin-top: 2px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 3px; }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .left-panel { max-height: 55vh; }
    .detail-drawer.open { height: 260px; }
    .detail-inner { grid-template-columns: 110px 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">みどりの<span>図鑑</span></div>
    <div class="logo-sub">MY PERSONAL PLANT JOURNAL</div>
  </div>
  <div class="header-stats" id="headerStats">0 件の記録</div>
</header>

<div class="app">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="upload-zone">
      <div class="drop-area" id="dropArea">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="drop-icon">🌿</div>
        <div class="drop-text">写真をドロップ / タップして選択</div>
        <div class="drop-sub">JPG・PNG・HEIC対応 ｜ 複数枚OK</div>
      </div>
      <div class="analyzing-bar" id="analyzingBar">
        <div class="analyzing-label">
          <span>AIが識別中</span>
          <div class="dot-pulse">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="entries-header">
      <span>記録一覧</span>
      <span class="entry-count" id="entryCount">0</span>
    </div>
    <div class="entries-list" id="entriesList">
      <div class="empty-state">
        <div class="empty-icon">🍃</div>
        <div class="empty-text">写真をアップロードして<br>図鑑を作り始めよう</div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div id="map"></div>
    <div class="detail-drawer" id="detailDrawer">
      <div class="detail-inner" id="detailInner"></div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">✏️ 記録を編集</div>
    <div class="field">
      <label>名前（日本語）</label>
      <input type="text" id="editName" placeholder="例：ソメイヨシノ">
    </div>
    <div class="field">
      <label>学名・英名</label>
      <input type="text" id="editSci" placeholder="例：Prunus × yedoensis">
    </div>
    <div class="field">
      <label>説明・メモ</label>
      <textarea id="editDesc" placeholder="気づいたことや特徴など..."></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>緯度</label>
        <input type="number" id="editLat" step="0.000001" placeholder="35.6812">
      </div>
      <div class="field">
        <label>経度</label>
        <input type="number" id="editLng" step="0.000001" placeholder="139.7671">
      </div>
    </div>
    <div class="field">
      <label>種別</label>
      <select id="editCategory">
        <option value="plant">🌿 植物</option>
        <option value="animal">🦋 生き物</option>
        <option value="other">🍄 その他</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelEdit">キャンセル</button>
      <button class="btn btn-save" id="saveEdit">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────
let entries = JSON.parse(localStorage.getItem('plantEntries') || '[]');
let activeId = null;
let editingId = null;
let map, markers = {};

// ─── MAP INIT ────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([35.6812, 139.7671], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);
}

function addMarker(entry) {
  if (!entry.lat || !entry.lng) return;
  if (markers[entry.id]) { markers[entry.id].remove(); }

  const color = entry.category === 'animal' ? '#c8a84b' :
                entry.category === 'other'  ? '#8b6f47' : '#4a6741';

  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:36px;height:36px;border-radius:50% 50% 50% 4px;
      transform:rotate(-45deg);
      background:${color};border:3px solid white;
      box-shadow:0 3px 12px rgba(0,0,0,.35);
      display:flex;align-items:center;justify-content:center;
    "><span style="transform:rotate(45deg);font-size:14px;">${entry.category==='animal'?'🦋':entry.category==='other'?'🍄':'🌿'}</span></div>`,
    iconSize: [36, 36], iconAnchor: [18, 36]
  });

  const marker = L.marker([entry.lat, entry.lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div class="popup-inner">
      <div class="popup-name">${entry.name}</div>
      <div class="popup-sci">${entry.sci || ''}</div>
      <div class="popup-date">📍 ${entry.date}</div>
    </div>
  `);
  marker.on('click', () => selectEntry(entry.id));
  markers[entry.id] = marker;
}

// ─── RENDER ──────────────────────────────────────
function renderList() {
  const list = document.getElementById('entriesList');
  const count = document.getElementById('entryCount');
  const stats = document.getElementById('headerStats');
  count.textContent = entries.length;
  stats.textContent = `${entries.length} 件の記録`;

  if (entries.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🍃</div><div class="empty-text">写真をアップロードして<br>図鑑を作り始めよう</div></div>`;
    return;
  }

  list.innerHTML = entries.map(e => {
    const badgeClass = e.category === 'animal' ? 'badge-animal' : e.category === 'other' ? 'badge-other' : 'badge-plant';
    const badgeLabel = e.category === 'animal' ? '生き物' : e.category === 'other' ? 'その他' : '植物';
    return `<div class="entry-card ${activeId===e.id?'active':''}" onclick="selectEntry('${e.id}')">
      <img class="entry-thumb" src="${e.imageData}" alt="">
      <div class="entry-info">
        <div class="entry-name">${e.name}</div>
        <div class="entry-sci">${e.sci || '—'}</div>
        <div class="entry-date">${e.date}</div>
      </div>
      <span class="entry-badge ${badgeClass}">${badgeLabel}</span>
    </div>`;
  }).join('');
}

function selectEntry(id) {
  activeId = id;
  const entry = entries.find(e => e.id === id);
  if (!entry) return;

  renderList();
  showDetail(entry);

  if (entry.lat && entry.lng && markers[id]) {
    map.flyTo([entry.lat, entry.lng], 15, { duration: 1.2 });
    markers[id].openPopup();
  }
}

function showDetail(entry) {
  const drawer = document.getElementById('detailDrawer');
  const inner = document.getElementById('detailInner');
  const locStr = (entry.lat && entry.lng)
    ? `${entry.lat.toFixed(5)}, ${entry.lng.toFixed(5)}`
    : '位置情報なし';

  inner.innerHTML = `
    <img class="detail-photo" src="${entry.imageData}" alt="">
    <div class="detail-body">
      <div class="detail-name">${entry.name}</div>
      <div class="detail-sci">${entry.sci || ''}</div>
      <div class="detail-desc">${entry.desc || ''}</div>
      <div class="detail-meta">
        <span class="meta-chip">📅 ${entry.date}</span>
        <span class="meta-chip">📍 ${locStr}</span>
        <span class="meta-chip">${entry.category==='animal'?'🦋 生き物':entry.category==='other'?'🍄 その他':'🌿 植物'}</span>
      </div>
      <div class="detail-actions">
        <button class="btn btn-edit" onclick="openEdit('${entry.id}')">✏️ 編集</button>
        <button class="btn btn-del" onclick="deleteEntry('${entry.id}')">🗑 削除</button>
        <button class="btn btn-close" onclick="closeDetail()">✕</button>
      </div>
    </div>
  `;
  drawer.classList.add('open');
}

function closeDetail() {
  document.getElementById('detailDrawer').classList.remove('open');
  activeId = null;
  renderList();
}

// ─── GEOLOCATION ─────────────────────────────────
function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      ()   => resolve(null),
      { timeout: 8000, maximumAge: 30000 }
    );
  });
}

// ─── AI IDENTIFICATION ───────────────────────────
async function identifyPlant(imageData, filename) {
  const base64 = imageData.split(',')[1];
  const mediaType = imageData.startsWith('data:image/png') ? 'image/png' :
                    imageData.startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          {
            type: 'image',
            source: { type: 'base64', media_type: mediaType, data: base64 }
          },
          {
            type: 'text',
            text: `この画像に写っている植物や生き物を同定してください。
必ず以下のJSON形式のみで返答してください（前後のテキストや\`\`\`は不要）:
{
  "name": "日本語名",
  "sci": "学名または英名",
  "category": "plant|animal|other",
  "desc": "2〜3文の簡潔な説明（生態、特徴、見られる場所など）"
}
植物・生き物が特定できない場合はnameに「不明な生物」と入れてください。`
          }
        ]
      }]
    })
  });

  if (!resp.ok) throw new Error('API error');
  const data = await resp.json();
  const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ─── FILE UPLOAD ─────────────────────────────────
async function handleFiles(files) {
  for (const file of files) {
    await processFile(file);
  }
}

async function processFile(file) {
  const bar = document.getElementById('analyzingBar');
  const fill = document.getElementById('progressFill');
  bar.classList.add('show');
  fill.style.animation = 'none';
  fill.style.width = '0';
  setTimeout(() => { fill.style.animation = 'progress-anim 4s ease-out forwards'; }, 50);

  // Read file
  const imageData = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });

  // Get location in parallel
  const [info, location] = await Promise.all([
    identifyPlant(imageData, file.name).catch(() => ({
      name: file.name.replace(/\.[^.]+$/, '') || '不明な植物',
      sci: '', category: 'plant', desc: 'AIによる識別に失敗しました。手動で編集してください。'
    })),
    getLocation()
  ]);

  bar.classList.remove('show');

  const entry = {
    id: Date.now().toString(),
    name: info.name,
    sci: info.sci || '',
    category: info.category || 'plant',
    desc: info.desc || '',
    date: new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit' }),
    lat: location?.lat || null,
    lng: location?.lng || null,
    imageData
  };

  entries.unshift(entry);
  save();
  renderList();
  addMarker(entry);

  if (location) {
    map.flyTo([location.lat, location.lng], 15, { duration: 1.5 });
  }
  selectEntry(entry.id);
  showToast(`✅ ${entry.name} を記録しました`);
}

// ─── EDIT ────────────────────────────────────────
function openEdit(id) {
  editingId = id;
  const e = entries.find(x => x.id === id);
  if (!e) return;
  document.getElementById('editName').value = e.name;
  document.getElementById('editSci').value  = e.sci || '';
  document.getElementById('editDesc').value = e.desc || '';
  document.getElementById('editLat').value  = e.lat ?? '';
  document.getElementById('editLng').value  = e.lng ?? '';
  document.getElementById('editCategory').value = e.category || 'plant';
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('saveEdit').onclick = () => {
  const idx = entries.findIndex(x => x.id === editingId);
  if (idx < 0) return;
  const e = entries[idx];
  e.name = document.getElementById('editName').value.trim() || e.name;
  e.sci  = document.getElementById('editSci').value.trim();
  e.desc = document.getElementById('editDesc').value.trim();
  e.lat  = parseFloat(document.getElementById('editLat').value) || null;
  e.lng  = parseFloat(document.getElementById('editLng').value) || null;
  e.category = document.getElementById('editCategory').value;
  save();
  renderList();
  addMarker(e);
  showDetail(e);
  document.getElementById('modalOverlay').classList.remove('open');
  showToast('💾 保存しました');
};

document.getElementById('cancelEdit').onclick = () => {
  document.getElementById('modalOverlay').classList.remove('open');
};
document.getElementById('modalOverlay').onclick = (ev) => {
  if (ev.target === ev.currentTarget)
    document.getElementById('modalOverlay').classList.remove('open');
};

// ─── DELETE ──────────────────────────────────────
function deleteEntry(id) {
  if (!confirm('この記録を削除しますか？')) return;
  if (markers[id]) { markers[id].remove(); delete markers[id]; }
  entries = entries.filter(e => e.id !== id);
  save();
  closeDetail();
  showToast('🗑 削除しました');
}

// ─── PERSIST ─────────────────────────────────────
function save() {
  // Save without imageData to keep storage light — store separately keyed
  const toSave = entries.map(e => ({ ...e }));
  try { localStorage.setItem('plantEntries', JSON.stringify(toSave)); } catch(err) {
    // quota exceeded — trim oldest
    entries = entries.slice(0, entries.length - 1);
    try { localStorage.setItem('plantEntries', JSON.stringify(entries)); } catch(e2) {}
  }
}

// ─── TOAST ───────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── DROP ZONE ───────────────────────────────────
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');

dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('drag-over'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('drag-over'));
dropArea.addEventListener('drop', e => {
  e.preventDefault(); dropArea.classList.remove('drag-over');
  if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files));
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

// ─── INIT ────────────────────────────────────────
initMap();
renderList();
entries.forEach(addMarker);

// Fit map to existing markers
if (entries.filter(e => e.lat).length > 0) {
  const pts = entries.filter(e => e.lat).map(e => [e.lat, e.lng]);
  map.fitBounds(pts, { padding: [40, 40] });
}
</script>
